# Checks every push: types and automated tests (sandbox, network, files, ZIP, database, bundled plugins).
# Tests run in Electron in Node mode, on Windows like the app. Without a replay folder, the real-replay test is skipped.
name: Tests
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
        timeout-minutes: 20
