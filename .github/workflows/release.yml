# Builds the Windows installer on every vX.Y.Z tag and publishes it to Releases.
name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, }
      - run: npm install --no-audit --no-fund   # no package-lock.json provided: it is generated by the first npm install
      # No release if the types or the tests fail.
      - run: npm run typecheck
      - run: npm test
        timeout-minutes: 20
      - run: npm run build
      # Studio engine (BrawlRender + vgmstream): binaries published in the studio-engine-r* pre-release
      # (built with "npm run studio:engine"; the engine code lives in the private BrawlStudio repository).
      - name: Moteur du Studio
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDIO_ENGINE_TAG: studio-engine-r5
        run: |
          gh release download $env:STUDIO_ENGINE_TAG -R $env:GITHUB_REPOSITORY -p studio-engine.zip -D $env:RUNNER_TEMP
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\studio-engine.zip" -DestinationPath resources\studio -Force
          if (-not (Test-Path resources\studio\engine\BrawlRender.exe)) { throw "BrawlRender.exe absent de l'archive" }
          if (-not (Test-Path resources\studio\vgmstream\vgmstream-cli.exe)) { throw "vgmstream absent de l'archive" }
      - run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
