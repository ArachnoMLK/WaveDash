# Compile l'installateur Windows à chaque tag vX.Y.Z et le publie dans les Releases.
name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, }
      - run: npm install --no-audit --no-fund   # pas de package-lock.json fourni : il sera généré au premier npm install
      # Pas de version publiée si les types ou les tests échouent.
      - run: npm run typecheck
      - run: npm test
        timeout-minutes: 20
      - run: npm run build
      # Moteur du Studio (BrawlRender + vgmstream) : binaires publiés dans la pré-release studio-engine-r*
      # (construits avec « npm run studio:engine », le code du moteur est dans le dépôt privé BrawlStudio).
      - name: Moteur du Studio
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDIO_ENGINE_TAG: studio-engine-r3
        run: |
          gh release download $env:STUDIO_ENGINE_TAG -R $env:GITHUB_REPOSITORY -p studio-engine.zip -D $env:RUNNER_TEMP
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\studio-engine.zip" -DestinationPath resources\studio -Force
          if (-not (Test-Path resources\studio\engine\BrawlRender.exe)) { throw "BrawlRender.exe absent de l'archive" }
          if (-not (Test-Path resources\studio\vgmstream\vgmstream-cli.exe)) { throw "vgmstream absent de l'archive" }
      - run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
