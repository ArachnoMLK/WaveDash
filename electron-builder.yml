appId: app.wavedash.desktop
productName: WaveDash
directories: { buildResources: resources, output: dist }
files: ["out/**/*", "package.json"]
asarUnpack: ["node_modules/ffmpeg-static/**"]                  # Studio ffmpeg: an executable cannot run from inside the asar archive
extraResources:
  - { from: resources, to: resources }                         # icons read at runtime (system tray)
  - { from: examples, to: plugins, filter: ['*.wdsh'] }        # plugins bundled with the app
fileAssociations:
  - ext: wdsh
    name: Plugin WaveDash
    description: Plugin WaveDash
    icon: resources/icon.ico
win:
  target: [{ target: nsis, arch: [x64] }]
  icon: resources/icon.ico
  artifactName: WaveDash-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: WaveDash
publish:
  provider: github   # read by electron-updater
  releaseType: release   # publishes the Release directly (otherwise it stays a draft and the app cannot see it)
