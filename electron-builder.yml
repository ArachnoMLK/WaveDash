appId: app.wavedash.desktop
productName: WaveDash
directories: { buildResources: resources, output: dist }
files: ["out/**/*", "package.json"]
extraResources:
  - { from: resources, to: resources }                         # icônes lues à l'exécution (barre système)
  - { from: examples, to: plugins, filter: ['*.wdsh'] }        # plugins fournis avec l'appli
fileAssociations:
  - ext: wdsh
    name: Plugin WaveDash
    description: Plugin WaveDash
    icon: resources/icon.ico
win:
  target: [{ target: nsis, arch: [x64] }]
  icon: resources/icon.ico
  artifactName: WaveDash-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: WaveDash
publish:
  provider: github   # lu par electron-updater
  releaseType: release   # publie directement la Release (sinon elle reste en brouillon et l’appli ne la voit pas)
